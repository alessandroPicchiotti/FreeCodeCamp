  <style>
    //Variabili dichiarazione
    :root {
      --main-font: 'Arial, sans-serif';
      --primary-color: blue; 
      --secondary-color: green; 
    }
    //Tipo Html
    :root {
      background: black;
      color: aliceblue;
    }
    //Per UL LI
    :empty {
      background: black;
    }
    :empty {
      display: none;
    }    
    //una parola chiave come odd o even. Questo è molto utile per definire lo stile delle celle di una tabella in base alla posizione: pari e dispari.
    tr:nth-child(even) {
      background-color: orangered;
    }
    
    tr:nth-child(odd) {
      background-color: lightgreen;
    }
  </style>
<h1>Welcome to My Website</h1>
